<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Visualization 轨道可视化 - 3D + Mercator</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; background: #0f0f1a; color: #ddd; overflow: hidden; }

#app { display: flex; height: 100vh; }

#sidebar {
    width: 340px; min-width: 340px; background: #1a1a2e;
    display: flex; flex-direction: column; padding: 16px;
    border-right: 1px solid #2a2a4a; overflow-y: auto;
}
#sidebar h2 { font-size: 1.2em; color: #e0e0ff; margin-bottom: 2px; text-align: center; }
#sidebar .subtitle { font-size: 0.68em; color: #777; text-align: center; margin-bottom: 12px; line-height: 1.4; }

.form-group { margin-bottom: 9px; }
.form-group label { display: block; font-size: 0.76em; color: #aab; margin-bottom: 2px; line-height: 1.35; }
.form-group label .cn { color: #ccd; }
.form-group label .en { color: #889; font-size: 0.92em; margin-left: 2px; }
.form-group input {
    width: 100%; padding: 6px 8px; background: #252540; border: 1px solid #3a3a5a;
    color: #eee; border-radius: 4px; font-size: 0.85em; outline: none;
}
.form-group input:focus { border-color: #5a7aff; }
.form-group textarea {
    width: 100%; padding: 6px 8px; background: #252540; border: 1px solid #3a3a5a;
    color: #eee; border-radius: 4px; font-size: 0.72em; outline: none;
    font-family: 'Consolas', 'Courier New', monospace; resize: vertical;
}
.form-group textarea:focus { border-color: #5a7aff; }
#btnParseTLE {
    width: 100%; padding: 6px; margin-top: 4px;
    background: #3a4a5a; color: #ccc; border: 1px solid #4a5a6a; border-radius: 4px;
    font-size: 0.78em; cursor: pointer;
}
#btnParseTLE:hover { background: #4a5a6a; color: #fff; }

#btnCompute {
    width: 100%; padding: 9px; margin-top: 4px;
    background: #4a5aff; color: #fff; border: none; border-radius: 4px;
    font-size: 0.88em; cursor: pointer; font-weight: 600; letter-spacing: 0.5px;
    transition: background 0.2s;
}
#btnCompute:hover { background: #5b6bff; }
#btnCompute:disabled { opacity: 0.5; cursor: not-allowed; }

.presets { margin-top: 12px; }
.presets h4 { font-size: 0.73em; color: #888; margin-bottom: 6px; letter-spacing: 1px; }
.preset-btns { display: flex; flex-wrap: wrap; gap: 5px; }
.preset-btn {
    padding: 4px 9px; font-size: 0.7em; background: #2a2a45; color: #aac;
    border: 1px solid #3a3a5a; border-radius: 3px; cursor: pointer;
    transition: background 0.15s;
}
.preset-btn:hover { background: #3a3a5a; color: #fff; }

#results {
    margin-top: 12px; padding: 10px; background: #12122a; border-radius: 6px;
    font-size: 0.75em;
}
#results h4 { font-size: 0.76em; color: #888; margin-bottom: 6px; letter-spacing: 1px; }
#results .row { display: flex; justify-content: space-between; padding: 2px 0; }
#results .row .label { color: #999; }
#results .row .value { color: #ccf; font-weight: 600; }

#status { margin-top: 8px; font-size: 0.65em; color: #666; min-height: 1.2em; text-align: center; }

#main { flex: 1; display: flex; flex-direction: column; }
#globe3d { flex: 1.2; min-height: 0; position: relative; background: #080818; }
#globe3d canvas { display: block; }

#tileBar {
    height: 32px; min-height: 32px; background: #1a1a2e;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border-top: 1px solid #2a2a4a; border-bottom: 1px solid #2a2a4a;
    padding: 0 12px;
}
#tileBar span { font-size: 0.65em; color: #777; }
#tileBar button {
    padding: 2px 8px; font-size: 0.65em; border: 1px solid #3a3a5a;
    background: #252540; color: #aaa; border-radius: 3px; cursor: pointer;
    font-family: inherit;
}
#tileBar button.active { background: #4a5aff; color: #fff; border-color: #4a5aff; }
#tileBar button:hover:not(.active) { background: #3a3a5a; color: #fff; }
#tileBar input[type=range] {
    width: 80px; height: 16px; accent-color: #4a5aff; margin: 0 4px;
}
#tileBar .speed-label { font-size: 0.6em; color: #888; min-width: 36px; text-align: center; }

#progressBar {
    height: 30px; min-height: 30px; background: #1a1a2e;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-top: 1px solid #2a2a4a; padding: 0 16px;
}
#progressBar .prog-label { font-size: 0.6em; color: #888; min-width: 48px; text-align: center; }
#progressBar input[type=range] { flex: 1; max-width: 500px; height: 12px; accent-color: #4a5aff; cursor: pointer; }
#btnPause {
    font-size: 0.65em; background: #252540; color: #aaa; border: 1px solid #3a3a5a;
    border-radius: 3px; cursor: pointer; padding: 2px 8px; line-height: 1.2;
}

#modeSwitch { display: flex; gap: 4px; margin-bottom: 12px; }
.mode-btn {
    flex: 1; padding: 6px 4px; font-size: 0.72em; background: #252540; color: #aaa;
    border: 1px solid #3a3a5a; border-radius: 4px; cursor: pointer;
}
.mode-btn:hover { background: #3a3a5a; color: #fff; }
.mode-btn.active { background: #4a5aff; color: #fff; border-color: #4a5aff; }

#map2d { flex: 1; min-height: 250px; position: relative; }
.leaflet-container { background: #1a2a3a; }
.leaflet-control-zoom a { background: #252540 !important; color: #ccc !important; border-color: #3a3a5a !important; }
.leaflet-control-zoom a:hover { background: #3a3a5a !important; }
.leaflet-control-attribution { background: rgba(26,26,46,0.8) !important; color: #888 !important; font-size: 0.6em !important; }
.leaflet-control-attribution a { color: #88a !important; }

#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #999; font-size: 0.85em; z-index: 10; pointer-events: none;
}
</style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h2>&#127758; Orbit Visualizer 轨道可视化</h2>
        <div class="subtitle">3D Globe + Mercator Ground Track<br>3D地球 · 墨卡托投影地面轨迹</div>

        <div id="modeSwitch">
            <button type="button" id="modeSingle" class="mode-btn active" data-mode="single">单星 Satellite</button>
            <button type="button" id="modeConstellation" class="mode-btn" data-mode="constellation">星座 Constellation</button>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
            <label><span class="cn">模拟开始时间 (UTC)</span> <span class="en">Sim Start（单星/星座共用）</span></label>
            <div style="display:flex; gap:4px;">
                <input type="date" id="simDate" style="flex:1.5;">
                <input type="time" id="simTimeInput" value="12:00:00" step="1" style="flex:1;">
            </div>
        </div>

        <form id="orbitForm" autocomplete="off">
            <div class="form-group">
                <label><span class="cn">近地点高度</span> <span class="en">Perigee Altitude (km)</span></label>
                <input type="number" id="perigee" value="400" step="any" required>
            </div>
            <div class="form-group">
                <label><span class="cn">远地点高度</span> <span class="en">Apogee Altitude (km)</span></label>
                <input type="number" id="apogee" value="400" step="any" required>
            </div>
            <div class="form-group">
                <label><span class="cn">轨道倾角</span> <span class="en">Inclination (deg, 0–180)</span></label>
                <input type="number" id="inclination" value="51.6" step="any" min="0" max="180" required>
            </div>
            <div class="form-group">
                <label><span class="cn">升交点赤经</span> <span class="en">RAAN (deg)</span></label>
                <input type="number" id="raan" value="0" step="any" required>
            </div>
            <div class="form-group">
                <label><span class="cn">近地点幅角</span> <span class="en">Argument of Perigee (deg)</span></label>
                <input type="number" id="argPerigee" value="0" step="any">
            </div>
            <div class="form-group">
                <label><span class="cn">地面轨迹圈数</span> <span class="en">Ground-Track Orbits</span></label>
                <input type="number" id="numOrbits" value="5" step="1" min="1" max="20">
            </div>
            <div class="form-group" style="margin-bottom:4px;">
                <label><span class="cn">轨道历元 (UTC)</span> <span class="en">Orbit Epoch</span></label>
                <input type="text" id="epochInput" placeholder="2026-06-15 12:00:00">
            </div>
            <div class="form-group">
                <label><span class="cn">快速加载 TLE</span> <span class="en">Quick Load TLE</span></label>
                <div style="display:flex; gap:4px;">
                    <select id="quickTleSelect" style="flex:1; padding:5px 6px; background:#252540; border:1px solid #3a3a5a; color:#eee; border-radius:4px; font-size:0.78em;">
                        <option value="25544">ISS 国际空间站</option>
                        <option value="48274">CSS 天宫空间站</option>
                        <option value="20580">Hubble 哈勃望远镜</option>
                        <option value="33591">NOAA 19 气象卫星</option>
                        <option value="24876">GPS BIIR-2 导航星</option>
                    </select>
                    <button type="button" id="btnQuickLoad" style="padding:5px 10px; background:#3a4a5a; color:#ccc; border:1px solid #4a5a6a; border-radius:4px; font-size:0.76em; cursor:pointer;">Load</button>
                </div>
            </div>
            <div class="form-group">
                <label><span class="cn">粘贴 TLE</span> <span class="en">Paste TLE Data</span></label>
                <textarea id="tleInput" rows="2" placeholder="CSS (TIANHE-1)&#10;1 48274U 21035A   26165.00000000 ...&#10;2 48274 041.4694 341.3988 0007573 ..."></textarea>
                <button type="button" id="btnParseTLE">Parse TLE 解析</button>
            </div>
            <button type="submit" id="btnCompute">Compute 计算轨道</button>
        </form>

        <div class="presets" id="presetsSection">
            <h4>Quick Presets 快捷预设</h4>
            <div class="preset-btns">
                <button class="preset-btn" data-preset="iss">ISS 国际空间站</button>
                <button class="preset-btn" data-preset="css">CSS 天宫空间站</button>
                <button class="preset-btn" data-preset="geo">GEO 地球同步</button>
                <button class="preset-btn" data-preset="molniya">Molniya 闪电</button>
                <button class="preset-btn" data-preset="gps">GPS 导航星</button>
                <button class="preset-btn" data-preset="polar">Polar 极轨</button>
            </div>
        </div>

        <div class="coverage-section" style="margin-top:12px;padding-top:10px;border-top:1px solid #2a2a4a;">
            <label style="display:flex;align-items:center;gap:6px;font-size:0.76em;color:#aab;cursor:pointer;margin-bottom:4px;">
                <input type="checkbox" id="toggleCoverage" style="accent-color:#4a5aff;">
                <span>Coverage 覆盖范围</span>
            </label>
            <div id="coverageControls" class="form-group" style="margin-bottom:4px;">
                <label>Min Elevation 最小仰角: <span id="elevLabel">10°</span></label>
                <input type="range" id="elevSlider" min="0" max="45" value="10" step="1" style="width:100%;">
            </div>
            <div style="display:flex; align-items:center; gap:5px; font-size:0.62em; color:#889; margin-top:2px;">
                <span>重叠数</span>
                <span style="width:14px;height:10px;background:rgba(0,120,255,0.75);display:inline-block;border-radius:2px;"></span><span>1</span>
                <span style="width:14px;height:10px;background:rgba(0,200,220,0.8);display:inline-block;border-radius:2px;"></span><span>2</span>
                <span style="width:14px;height:10px;background:rgba(30,220,100,0.85);display:inline-block;border-radius:2px;"></span><span>3</span>
                <span style="width:14px;height:10px;background:rgba(255,190,0,0.9);display:inline-block;border-radius:2px;"></span><span>4</span>
                <span style="width:14px;height:10px;background:rgba(255,60,60,0.95);display:inline-block;border-radius:2px;"></span><span>5+</span>
            </div>
        </div>

        <div class="coverage-section" id="constellationSection" style="margin-top:12px;padding-top:10px;border-top:1px solid #2a2a4a; display:none;">
            <label style="display:flex;align-items:center;gap:6px;font-size:0.76em;color:#aab;margin-bottom:6px;">
                <span>Constellation 星座跟踪</span>
            </label>
            <div class="form-group" style="margin-bottom:4px;">
                <label>Group 星座组</label>
                <select id="constellationSelect" style="width:100%;padding:5px 6px;background:#252540;border:1px solid #3a3a5a;color:#eee;border-radius:4px;font-size:0.78em;">
                    <option value="gps-ops">GPS 全球定位</option>
                    <option value="beidou">北斗 BeiDou</option>
                    <option value="weather">风云/气象 Weather</option>
                    <option value="starlink">星链 Starlink</option>
                    <option value="iridium-next">铱星 Iridium NEXT</option>
                    <option value="galileo">伽利略 Galileo</option>
                    <option value="glo-ops">格洛纳斯 GLONASS</option>
                    <option value="oneweb">OneWeb</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:4px;">
                <label>Max Sats 采样数量: <span id="densityLabel">60</span></label>
                <input type="range" id="constellationDensity" min="10" max="200" value="60" step="10" style="width:100%;">
            </div>
            <div class="form-group" style="margin-bottom:6px;">
                <label>Select Satellite 选择卫星</label>
                <div style="display:flex; gap:4px;">
                    <select id="constellationSatSelect" disabled style="flex:2; padding:5px 6px; background:#252540; border:1px solid #3a3a5a; color:#eee; border-radius:4px; font-size:0.78em;">
                        <option value="">-- 加载星座后选择 --</option>
                    </select>
                    <button type="button" id="btnViewSingle" disabled style="padding:5px 8px; background:#3a4a5a; color:#ccc; border:1px solid #4a5a6a; border-radius:4px; font-size:0.72em; cursor:pointer; white-space:nowrap;">单星查看</button>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button type="button" id="btnLoadConstellation" style="flex:1;padding:7px;background:#3a4a5a;color:#ccc;border:1px solid #4a5a6a;border-radius:4px;font-size:0.76em;cursor:pointer;">Load 加载星座</button>
                <button type="button" id="btnClearConstellation" style="flex:1;padding:7px;background:#4a3a3a;color:#ccc;border:1px solid #6a4a4a;border-radius:4px;font-size:0.76em;cursor:pointer;">Clear 清除</button>
            </div>
            <label style="display:flex;align-items:center;gap:6px;font-size:0.76em;color:#aab;cursor:pointer;margin-top:6px;">
                <input type="checkbox" id="toggleTrails" checked style="accent-color:#4a5aff;">
                <span>Ground Trails 星下点轨迹</span>
            </label>
        </div>

        <div id="results">
            <h4>Orbital Elements 轨道参数</h4>
            <div id="resultsContent" style="color:#666;">Press Compute to see results<br>点击"计算轨道"查看结果</div>
        </div>
        <div id="status"></div>
    </div>

    <div id="main">
        <div id="globe3d">
            <div id="loading">Loading 3D Engine...<br>正在加载3D引擎...</div>
        </div>
        <div id="progressBar">
            <button id="btnPause" title="Pause/Resume">&#9646;&#9646;</button>
            <input type="range" id="progSlider" min="0" max="1000" value="0" step="1">
            <span class="prog-label" id="progTimeLabel" style="min-width:280px;text-align:center;font-family:monospace;font-size:0.65em;">T+00:00:00 / ----</span>
        </div>
<div id="tileBar">
    <span>Map 地图:</span>
    <button class="tile-btn active" data-tile="satellite">Satellite 卫星</button>
    <span style="margin-left:16px;">Speed 速度:</span>
            <input type="range" id="speedSlider" min="2" max="30" value="10" step="1">
            <span class="speed-label" id="speedLabel">10s</span>
        </div>
        <div id="map2d">
            <canvas id="coverageHeatmap" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:440;"></canvas>
            <svg id="d3Overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:450; overflow:hidden;"></svg>
        </div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "/static/vendor/three/three.module.js",
        "three/addons/": "/static/vendor/three/"
    }
}
</script>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/d3-array.min.js"></script>
<script src="/static/vendor/d3-geo.min.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const R_EARTH = 6378.137;
const OMEGA_E = 7.2921159e-5;

function setStatus(msg) {
    const el = document.getElementById('status');
    if (el) { el.textContent = msg; console.log('[status]', msg); }
}

const globeContainer = document.getElementById('globe3d');
const loadingEl = document.getElementById('loading');
const map2dEl = document.getElementById('map2d');
const form = document.getElementById('orbitForm');
const btnCompute = document.getElementById('btnCompute');
const resultsContent = document.getElementById('resultsContent');
const presetBtns = document.querySelectorAll('.preset-btn');
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
const progSlider = document.getElementById('progSlider');
const progTimeLabel = document.getElementById('progTimeLabel');

let animSpeedSec = 10;
let isScrubbing = false;
let currentEpoch = null;
let coverageEnabled = false;
let coverageElevation = 10;
let oldCoverageElevation = 10;
// Constellation state (3D group is created later, after the scene exists)
let constellationMode = false;
let constellationGroupKey = null;
let constellation = null;
let selectedSatIndex = -1;
let lastSingleData = null;
let uiMode = 'single';
let constellationCache = null; // { groupKey, density, rawSats, sourceLabel, totalCount }
let constellationSourceLabel = '';
let singleSatName = null;
let lastSimElapsed = 0;
let lastThetaGP = 0;
let covHeatFrame = 0;

const covHeatCanvas = document.getElementById('coverageHeatmap');
const covHeatCtx = covHeatCanvas.getContext('2d');
const covAccCanvas = document.createElement('canvas');
const covAccCtx = covAccCanvas.getContext('2d');

function formatUtc(date) {
    return date.toISOString().replace('T', ' ').substring(0, 19);
}

function parseEpochInput(str) {
    if (!str || !str.trim()) return null;
    const d = new Date(str.trim() + 'Z');
    if (!isNaN(d.getTime())) return d;
    const m = str.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})(?::(\d{2}))?$/);
    if (m) {
        const utc = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
        if (!isNaN(utc)) return new Date(utc);
    }
    return null;
}

function formatElapsed(sec) {
    sec = Math.max(0, sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return 'T+' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

speedSlider.addEventListener('input', () => {
    animSpeedSec = parseInt(speedSlider.value);
    speedLabel.textContent = animSpeedSec + 's';
});

document.getElementById('constellationDensity').addEventListener('input', (e) => {
    document.getElementById('densityLabel').textContent = e.target.value;
});

progSlider.addEventListener('input', () => {
    isScrubbing = true;
});

progSlider.addEventListener('change', () => {
    // Resume auto-animation from scrubbed position
    const frac = parseInt(progSlider.value) / 1000;
    animStartTime = performance.now() / 1000 - frac * animSpeedSec * numOrbitsAnim;
    isScrubbing = false;
});

let isPaused = false;
const btnPause = document.getElementById('btnPause');
btnPause.addEventListener('click', () => {
    isPaused = !isPaused;
    btnPause.innerHTML = isPaused ? '&#9654;' : '&#9646;&#9646;';
    if (!isPaused) {
        // Resume: reset timer so animation continues from current position
        const frac = parseInt(progSlider.value) / 1000;
        animStartTime = performance.now() / 1000 - frac * animSpeedSec * numOrbitsAnim;
    }
});

// ── TILE LAYERS ──
const tileProviders = {
    satellite: {
        url: '/static/tiles/esri/{z}/{x}/{y}.png',
        attr: '&copy; Esri (offline)',
        maxZoom: 5, minZoom: 0,
        errorTileUrl: '/static/placeholder.png'
    }
};

let activeTileLayer = null;

// ── Leaflet map ──
const leafletMap = L.map(map2dEl, {
    zoomControl: false, attributionControl: true,
    scrollWheelZoom: false, dragging: false, doubleClickZoom: false,
    touchZoom: false, keyboard: false,
    maxBounds: [[-90, -180], [90, 180]],
    maxBoundsViscosity: 1.0, zoomSnap: 0.5
}).setView([0, 0], 2);

function setTileLayer(key) {
    const prov = tileProviders[key];
    if (!prov) return;
    if (activeTileLayer) leafletMap.removeLayer(activeTileLayer);
    activeTileLayer = L.tileLayer(prov.url, {
        maxZoom: prov.maxZoom,
        minZoom: prov.minZoom != null ? prov.minZoom : 2,
        attribution: prov.attr,
        noWrap: true,
        errorTileUrl: prov.errorTileUrl
    }).addTo(leafletMap);
    document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`.tile-btn[data-tile="${key}"]`);
    if (btn) btn.classList.add('active');
    leafletMap.invalidateSize();
}

setTileLayer('satellite');

// ── d3-geo SVG overlay (spherical clipping for terminator / coverage fills) ──
const d3Svg = document.getElementById('d3Overlay');
const d3Proj = d3.geoMercator().translate([0, 0]).scale(1);

const d3Paths = {};
function makeD3Path(id, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    el.setAttribute('id', id);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    d3Svg.appendChild(el);
    d3Paths[id] = el;
    return el;
}

function setD3Path(id, geo) {
    d3Paths[id].setAttribute('d', d3PathGen(geo) || '');
}
function syncD3Projection() {
    const w = map2dEl.clientWidth, h = map2dEl.clientHeight;
    if (w <= 0 || h <= 0) return;
    const c = leafletMap.getCenter();
    const zoom = leafletMap.getZoom();
    // 精确 Web Mercator 容器坐标:Leaflet 的 latLngToContainerPoint 内部会取整(_round),
    // 导致参考点像素差失真(0.5° 在 zoom 2 下仅 1px vs 真实 1.42px,比例误差 ~30%)
    const pt = (lat, lng) => {
        const p = L.CRS.EPSG3857.latLngToPoint(L.latLng(lat, lng), zoom);
        const o = leafletMap.getPixelOrigin();
        return { x: p.x - o.x, y: p.y - o.y };
    };
    const p0 = pt(c.lat, c.lng);
    const p1 = pt(c.lat, c.lng + 1);
    const k = (p1.x - p0.x) / (Math.PI / 180);
    const lam = c.lng * Math.PI / 180, phi = c.lat * Math.PI / 180;
    const tx = p0.x - k * lam;
    // d3 geoMercator 默认 y 向上为正(纬度增大 y 减小),与 Leaflet 一致;不需要 reflectY
    const ty = p0.y + k * Math.log(Math.tan(Math.PI / 4 + phi / 2));
    d3Proj.scale(k).translate([tx, ty]).clipExtent([[0, 0], [w, h]]);
}
syncD3Projection();

function makeRing(radius, color, dashSize) {
    const pts = [];
    const n = 300;
    for (let i = 0; i <= n; i++) {
        const a = (i / n) * Math.PI * 2;
        pts.push(new THREE.Vector3(radius * Math.cos(a), 0, radius * Math.sin(a)));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    if (dashSize) {
        const m = new THREE.LineDashedMaterial({ color, dashSize, gapSize: dashSize * 0.7 });
        const l = new THREE.Line(g, m);
        l.computeLineDistances();
        return l;
    }
    return new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.5 }));
}

// ── Sun / Terminator ──
function getSunECI(date) {
    const start = new Date(date.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((date - start) / 86400000);
    const lambda = ((dayOfYear - 80) * 360 / 365) * Math.PI / 180;
    const epsilon = 23.44 * Math.PI / 180;
    const ra = Math.atan2(Math.cos(epsilon) * Math.sin(lambda), Math.cos(lambda));
    const dec = Math.asin(Math.sin(epsilon) * Math.sin(lambda));
    return {
        ra: ra * 180 / Math.PI,
        dec: dec * 180 / Math.PI,
        dir: new THREE.Vector3(
            Math.cos(dec) * Math.cos(ra),
            Math.sin(dec),
            -Math.cos(dec) * Math.sin(ra)
        )
    };
}

function getGST(date) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const t = (jd - 2451545.0) / 36525.0;
    const gst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * t * t - t * t * t / 38710000;
    return ((gst % 360) + 360) % 360;
}

function splitLonWrap(points) {
    if (points.length < 2) return [points];
    const segments = [];
    let seg = [points[0]];
    for (let i = 1; i < points.length; i++) {
        const lonDiff = points[i][1] - points[i - 1][1];
        if (Math.abs(lonDiff) > 180) {
            const prev = points[i - 1], curr = points[i];
            const boundLon = prev[1] > 0 ? 180 : -180;
            const lonP = prev[1], lonC = lonDiff > 0 ? curr[1] - 360 : curr[1] + 360;
            const frac = (boundLon - lonP) / (lonC - lonP);
            const lat = prev[0] + frac * (curr[0] - prev[0]);
            seg.push([lat, boundLon]);
            segments.push(seg);
            seg = [[lat, -boundLon], curr];
        } else {
            seg.push(points[i]);
        }
    }
    if (seg.length > 0) segments.push(seg);
    return segments;
}

function wrapLon(lon) {
    return ((lon + 540) % 360 + 360) % 360 - 180;
}

function buildTerminatorNight(sunLon, sunDec) {
    // 晨昏线在纬度 ±(90−|δ|) 处收敛:高纬端(极昼极)收敛于午夜经线,低纬端收敛于正午经线
    const decRad = sunDec * Math.PI / 180;
    const lim = 90 - Math.abs(sunDec);
    const noonLon = wrapLon(sunLon), midLon = wrapLon(sunLon + 180);
    const northEndLon = sunDec >= 0 ? midLon : noonLon;
    const southEndLon = sunDec >= 0 ? noonLon : midLon;
    const evening = [[-lim, southEndLon]], morning = [[-lim, southEndLon]];
    for (let lat = -90; lat <= 90; lat += 0.5) {
        const phi = lat * Math.PI / 180;
        const tpd = Math.tan(phi) * Math.tan(decRad);
        if (Math.abs(tpd) <= 1) {
            const H = Math.acos(-tpd) * 180 / Math.PI;
            evening.push([lat, wrapLon(sunLon - H)]);
            morning.push([lat, wrapLon(sunLon + H)]);
        }
    }
    if (evening.length < 3) return null;
    evening.push([lim, northEndLon]);
    morning.push([lim, northEndLon]);
    // 黑夜区域环:evening(南→北)+ morning(北→南),所有顶点均在晨昏线上,自然闭合
    const ring = [...evening, ...morning.slice().reverse()];
    // 方向校验:黑夜环必须包含反太阳点(午夜经线);否则翻转顶点顺序
    const poly = { type: 'Polygon', coordinates: [ring.map(p => [p[1], p[0]])] };
    if (!d3.geoContains(poly, [wrapLon(sunLon + 180), 0])) ring.reverse();
    // GeoJSON 坐标顺序为 [lon, lat]
    const ringLonLat = ring.map(p => [p[1], p[0]]);
    return {
        fill: { type: 'Polygon', coordinates: [ringLonLat] },
        line: { type: 'LineString', coordinates: ringLonLat },
    };
}

function updateTerminatorDynamic(gstNow) {
    const sunLon = ((sunRA - gstNow + 180) % 360 + 360) % 360 - 180;
    const night = buildTerminatorNight(sunLon, sunDec);
    if (!night) {
        setD3Path('terminatorFill', null);
        setD3Path('terminatorLine', null);
        return;
    }
    setD3Path('terminatorFill', night.fill);
    setD3Path('terminatorLine', night.line);
}

function computeCoverageCircle(latDeg, lonDeg, elevAngle, altitude) {
    const R_E = 6378.137;
    const thetaRad = elevAngle * Math.PI / 180;
    const h = altitude;
    const sinEta = R_E * Math.cos(thetaRad) / (R_E + h);
    if (sinEta >= 1) return [];
    const lambda = Math.PI / 2 - thetaRad - Math.asin(sinEta);
    if (lambda <= 0) return [];
    const clat = latDeg * Math.PI / 180;
    const clon = lonDeg * Math.PI / 180;
    const pts = [];
    for (let i = 0; i <= COV_N; i++) {
        const b = (i / COV_N) * 2 * Math.PI;
        const rlat = Math.asin(Math.sin(clat) * Math.cos(lambda) + Math.cos(clat) * Math.sin(lambda) * Math.cos(b));
        const rlon = clon + Math.atan2(Math.sin(b) * Math.sin(lambda) * Math.cos(clat), Math.cos(lambda) - Math.sin(clat) * Math.sin(rlat));
        const lat = rlat * 180 / Math.PI;
        const lon = ((rlon * 180 / Math.PI) + 540) % 360 - 180;
        const ex = R_E * Math.cos(rlat) * Math.cos(rlon);
        const ey = R_E * Math.cos(rlat) * Math.sin(rlon);
        const ez = R_E * Math.sin(rlat);
        pts.push({ lat, lon, ex, ey, ez });
    }
    return pts;
}

function updateCoverage(satLat, satLon, alt, eciX, eciY, eciZ, thetaGP) {
    coverage3DGroup.visible = coverageEnabled;
    coverageConeGroup.visible = coverageEnabled;
    if (!coverageEnabled) {
        setD3Path('coverageFill', null);
        setD3Path('coverageLine', null);
        return;
    }
    const pts = computeCoverageCircle(satLat, satLon, coverageElevation, alt);
    if (pts.length === 0) {
        setD3Path('coverageFill', null);
        setD3Path('coverageLine', null);
        return;
    }
    covCirclePts = pts;
    // 2D 覆盖球冠:直接作为球面多边形渲染,极点/日界线由 d3 球面裁剪处理
    const ringLonLat = pts.map(p => [p.lon, p.lat]);
    setD3Path('coverageFill', { type: 'Polygon', coordinates: [ringLonLat] });
    setD3Path('coverageLine', { type: 'LineString', coordinates: ringLonLat });
    // 3D circle on earthGroup (earth-local ECEF coords)
    const posAttr = covLine.geometry.attributes.position;
    const array = posAttr.array;
    for (let i = 0; i <= COV_N && i < pts.length; i++) {
        array[i * 3] = pts[i].ex;
        array[i * 3 + 1] = pts[i].ez;
        array[i * 3 + 2] = -pts[i].ey;
    }
    posAttr.needsUpdate = true;
    // 3D cone from satellite world pos to circle world pos
    const satWorld = eciToThree(eciX, eciY, eciZ);
    const mat = earthGroup.matrixWorld;
    const cPos = covCone.geometry.attributes.position;
    const cArr = cPos.array;
    for (let i = 0; i < COV_N; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % pts.length];
        const va = new THREE.Vector3(a.ex, a.ez, -a.ey).applyMatrix4(mat);
        const vb = new THREE.Vector3(b.ex, b.ez, -b.ey).applyMatrix4(mat);
        const idx = i * 9;
        cArr[idx] = satWorld.x; cArr[idx + 1] = satWorld.y; cArr[idx + 2] = satWorld.z;
        cArr[idx + 3] = va.x; cArr[idx + 4] = va.y; cArr[idx + 5] = va.z;
        cArr[idx + 6] = vb.x; cArr[idx + 7] = vb.y; cArr[idx + 8] = vb.z;
    }
    cPos.needsUpdate = true;
    covCone.geometry.computeVertexNormals();
}

// ── TLE parser ──
let hasTLE = false;
let M0_at_epoch = 0;
let nRevPerDay = 0;
let epochDate = null;
let tOffset = 0;

function parseTLE(text) {
    const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l);
    let line1, line2;
    if (lines.length === 3) { line1 = lines[1]; line2 = lines[2]; }
    else if (lines.length === 2) { line1 = lines[0]; line2 = lines[1]; }
    else throw new Error('Need 2 or 3 TLE lines');
    if (!line1.startsWith('1 ') || !line2.startsWith('2 ')) throw new Error('Invalid TLE format');

    const inclination = parseFloat(line2.substring(8, 16));
    const raan = parseFloat(line2.substring(17, 25));
    const e = parseFloat('0.' + line2.substring(26, 33));
    const argPerigee = parseFloat(line2.substring(34, 42));
    const meanAnomaly = parseFloat(line2.substring(43, 51));
    const meanMotion = parseFloat(line2.substring(52, 63));

    const epochStr = line1.substring(18, 32);
    const epochYear = parseInt('20' + epochStr.substring(0, 2));
    const epochDay = parseFloat(epochStr.substring(2));
    const epochDateObj = new Date(Date.UTC(epochYear, 0, 1));
    epochDateObj.setUTCDate(epochDateObj.getUTCDate() + Math.floor(epochDay) - 1);
    const dayFrac = epochDay - Math.floor(epochDay);
    epochDateObj.setUTCHours(Math.floor(dayFrac * 24));
    epochDateObj.setUTCMinutes(Math.floor((dayFrac * 24) % 1 * 60));

    const MU = 398600.4418;
    const RE = 6378.137;
    const nRadPerSec = meanMotion * 2 * Math.PI / 86400;
    const a = Math.pow(MU / (nRadPerSec * nRadPerSec), 1 / 3);
    const hp = a * (1 - e) - RE;
    const ha = a * (1 + e) - RE;

    return { perigee: hp, apogee: ha, inclination, raan, argPerigee, meanAnomaly, meanMotion, e, epoch: epochDateObj, a };
}

function recomputeOrbitWithAnomaly(M) {
    const perigee = parseFloat(document.getElementById('perigee').value) || 400;
    const apogee = parseFloat(document.getElementById('apogee').value) || 400;
    const inclination = parseFloat(document.getElementById('inclination').value) || 51.6;
    const raan = parseFloat(document.getElementById('raan').value) || 0;
    const argPerigee = parseFloat(document.getElementById('argPerigee').value) || 0;
    const numOrbits = parseInt(document.getElementById('numOrbits').value, 10) || 5;
    computeOrbit({ perigee, apogee, inclination, raan, arg_perigee: argPerigee, num_orbits: numOrbits, mean_anomaly: M });
}

// ── Helpers ──
function eciToThree(eciX, eciY, eciZ) {
    // ECI (x, y, z) -> Three.js (x, z, -y) preserves right-hand rule
    return new THREE.Vector3(eciX, eciZ, -eciY);
}

function clearGroup(group) {
    while (group.children.length > 0) {
        const child = group.children[0];
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
            (Array.isArray(child.material) ? child.material : [child.material]).forEach(m => { try { m.dispose(); } catch(e) {} });
        }
        group.remove(child);
    }
}

function getEciPosition(fraction) {
    if (orbitEciX.length === 0) return [0, 0, 0];
    const idx = fraction * (orbitEciX.length - 1);
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, orbitEciX.length - 1);
    const t = idx - i0;
    return [
        orbitEciX[i0] + (orbitEciX[i1] - orbitEciX[i0]) * t,
        orbitEciY[i0] + (orbitEciY[i1] - orbitEciY[i0]) * t,
        orbitEciZ[i0] + (orbitEciZ[i1] - orbitEciZ[i0]) * t,
    ];
}

function eciToLatLon(eciX, eciY, eciZ, theta) {
    const x_ecef = eciX * Math.cos(theta) + eciY * Math.sin(theta);
    const y_ecef = -eciX * Math.sin(theta) + eciY * Math.cos(theta);
    const z_ecef = eciZ;
    const r_xy = Math.sqrt(x_ecef * x_ecef + y_ecef * y_ecef);
    const lat = Math.atan2(z_ecef, r_xy) * 180 / Math.PI;
    const lon = Math.atan2(y_ecef, x_ecef) * 180 / Math.PI;
    return [lat, lon];
}

// ── Update 3D ──
function updateOrbit3D(data) {
    try {
        clearGroup(orbitGroup);
        clearGroup(eqPlaneGroup);
        coverage3DGroup.visible = false;
        coverageConeGroup.visible = false;

        const { orbit_3d, orbit_anim, orbital_elements, num_orbits } = data;
        const semiMajor = orbital_elements.semi_major_axis;
        const axisLen = semiMajor * 1.6;

        // Store multi-orbit ECI data for animation
        orbitEciX = orbit_anim.x;
        orbitEciY = orbit_anim.y;
        orbitEciZ = orbit_anim.z;
        orbitPeriodSec = orbital_elements.period_min * 60;
        numOrbitsAnim = num_orbits || 1;
        const ma = orbital_elements.mean_anomaly || 0;
        tOffset = ma * orbitPeriodSec / 360;
        hasOrbit = true;

        // Build orbit tube from single-orbit data
        const orbitPts = [];
        const count = orbit_3d.x.length;
        for (let i = 0; i < count; i++) {
            orbitPts.push(eciToThree(orbit_3d.x[i], orbit_3d.y[i], orbit_3d.z[i]));
        }
        if (orbitPts.length >= 2) {
            orbitCurve3D = new THREE.CatmullRomCurve3(orbitPts, true);
            const tubeGeom = new THREE.TubeGeometry(orbitCurve3D, Math.min(count, 300), 15, 8, true);
            const tubeMat = new THREE.MeshPhongMaterial({ color: 0xe74c3c, emissive: 0x330000, shininess: 80 });
            orbitGroup.add(new THREE.Mesh(tubeGeom, tubeMat));
        }

        // Satellite marker (glowing)
        satMarkerGroup = new THREE.Group();
        const coreGeom = new THREE.SphereGeometry(150, 32, 32);
        const coreMat = new THREE.MeshPhongMaterial({ color: 0xffdd44, emissive: 0xff8800, emissiveIntensity: 2, shininess: 100 });
        const core = new THREE.Mesh(coreGeom, coreMat);
        satMarkerGroup.add(core);

        const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
            transparent: true, opacity: 0.8
        }));
        glowSprite.scale.set(1000, 1000, 1);
        satMarkerGroup.add(glowSprite);
        orbitGroup.add(satMarkerGroup);

        // Ground projection marker (child of earthGroup, rotates with Earth)
        const oldGp = earthGroup.getObjectByName('groundProj');
        if (oldGp) {
            earthGroup.remove(oldGp);
            if (oldGp.geometry) oldGp.geometry.dispose();
            if (oldGp.material) {
                (Array.isArray(oldGp.material) ? oldGp.material : [oldGp.material]).forEach(m => { try { m.dispose(); } catch(e) {} });
            }
        }
        const gpGeom = new THREE.SphereGeometry(50, 16, 16);
        const gpMat = new THREE.MeshPhongMaterial({ color: 0x00ffcc, emissive: 0x00aa88, emissiveIntensity: 1.5 });
        const gpMarker = new THREE.Mesh(gpGeom, gpMat);
        gpMarker.name = 'groundProj';
        earthGroup.add(gpMarker);

        // Coordinate axes
        function addAxis(dir, color, length) {
            const pts = [new THREE.Vector3(0, 0, 0), dir.clone().multiplyScalar(length)];
            orbitGroup.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(pts),
                new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.6 })
            ));
        }
        addAxis(new THREE.Vector3(1, 0, 0), 0xff4444, axisLen);
        addAxis(new THREE.Vector3(0, 1, 0), 0x44ff44, axisLen);
        addAxis(new THREE.Vector3(0, 0, 1), 0x4444ff, axisLen);

        for (let r = R_EARTH * 1.5; r <= semiMajor * 1.4; r += semiMajor * 0.35) {
            eqPlaneGroup.add(makeRing(r, 0x334466, null));
        }

        const dist = semiMajor * 3.0;
        if (dist > controls.minDistance) {
            controls.target.set(0, 0, 0);
            const cd = camera.position.clone().normalize();
            if (cd.length() < 0.1) cd.set(0.6, 0.5, 0.7);
            camera.position.copy(cd.multiplyScalar(dist));
        }
        controls.update();

        // Reset animation timer
        animStartTime = performance.now() / 1000;
    } catch (e) {
        setStatus('3D update error: ' + e.message);
    }
}

// ── Update 2D ground track ──
function updateGroundTrack2D(data) {
    try {
        groundTrackLayer.clearLayers();
        if (leafletStartMarker) { leafletMap.removeLayer(leafletStartMarker); leafletStartMarker = null; }
        if (leafletSatMarker2D) { leafletMap.removeLayer(leafletSatMarker2D); leafletSatMarker2D = null; }

        const { segments } = data.ground_track;

        const gstOffsetDeg = currentEpoch
            ? ((getGST(currentEpoch) % 360) - OMEGA_E * tOffset * 180 / Math.PI + 360) % 360
            : 0;

        const allCoords = [];
        segments.forEach(([lats, lons]) => {
            for (let i = 0; i < lats.length; i++) {
                allCoords.push([lats[i], ((lons[i] - gstOffsetDeg + 540) % 360) - 180]);
            }
        });
        const splitSegs = splitLonWrap(allCoords);
        splitSegs.forEach(seg => { if (seg.length > 0) L.polyline(seg, { color: '#E74C3C', weight: 2, opacity: 0.85 }).addTo(groundTrackLayer); });

        // Animated satellite marker on 2D map
        leafletSatMarker2D = L.circleMarker([0, 0], {
            radius: 6, color: '#ffdd44', fillColor: '#ff8800', fillOpacity: 1, weight: 2
        }).addTo(leafletMap).bindPopup('Satellite 航天器');

        setTimeout(() => leafletMap.invalidateSize(), 100);
    } catch (e) {
        setStatus('2D update error: ' + e.message);
    }
}

// ── Update results panel ──
function updateResults(data) {
    try {
        const el = data.orbital_elements;
        const gt = data.ground_track;
        const z = data.orbit_3d.z;
        const zMax = Math.max(...z.map(Math.abs));
        // Sub-satellite point at epoch
        const x0 = data.orbit_3d.x[0];
        const y0 = data.orbit_3d.y[0];
        const z0 = data.orbit_3d.z[0];
        const r0 = Math.sqrt(x0 * x0 + y0 * y0 + z0 * z0);
        const subLat = (Math.asin(z0 / r0) * 180 / Math.PI).toFixed(2);
        let subLonStr = '--';
        if (currentEpoch && !isNaN(currentEpoch.getTime())) {
            const ra = Math.atan2(y0, x0) * 180 / Math.PI;
            const gst = getGST(currentEpoch) % 360;
            const subLon = ((ra - gst + 540) % 360 - 180).toFixed(2);
            const lonVal = parseFloat(subLon);
            subLonStr = Math.abs(lonVal).toFixed(2) + (lonVal >= 0 ? '°E' : '°W');
        }
        const rows = [
            ['历元时刻星下点 Sub-sat pt @epoch', `(${subLat}°, ${subLonStr})`],
            ['半长轴 Semi-major axis', `${el.semi_major_axis.toLocaleString()} km`],
            ['偏心率 Eccentricity', `${el.eccentricity}`],
            ['周期 Period', `${el.period_min.toLocaleString()} min`],
            ['近地点高度 Perigee alt', `${el.perigee_alt.toLocaleString()} km`],
            ['远地点高度 Apogee alt', `${el.apogee_alt.toLocaleString()} km`],
            ['轨道面Z偏移 Orbit Z-offset', `${zMax.toFixed(4)} km (0=equatorial)`],
        ];
        if (gt.segments && gt.segments.length > 0) {
            const seg0 = gt.segments[0];
            const lats = seg0[0];
            const lons = seg0[1];
            const n = Math.min(3, lats.length);
            const pts = [];
            for (let i = 0; i < n; i++) pts.push(`(${lats[i].toFixed(1)}°,${lons[i].toFixed(1)}°)`);
            rows.push(['地面轨迹样例 GT sample', pts.join(' ')]);
        }
        if (singleSatName) rows.unshift(['卫星名称 Name', singleSatName]);
        resultsContent.innerHTML = rows.map(([label, value]) =>
            `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`
        ).join('');
    } catch (e) {
        setStatus('Results update error: ' + e.message);
    }
}

// ── API call ──
async function computeOrbit(params) {
    if (uiMode !== 'single') setUiMode('single');
    setStatus(`Computing: p=${params.perigee} a=${params.apogee} i=${params.inclination} raan=${params.raan} w=${params.arg_perigee} ...`);
    btnCompute.disabled = true;
    btnCompute.textContent = 'Computing 计算中...';
    try {
        const resp = await fetch('/api/compute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(params)
        });
        if (!resp.ok) {
            let errMsg = resp.statusText;
            try { const err = await resp.json(); errMsg = err.error || errMsg; } catch(e) {}
            alert('Error 错误: ' + errMsg);
            setStatus('Error: ' + errMsg);
            return;
        }
        const data = await resp.json();
        lastSingleData = data;
        setStatus('Rendering 渲染中...');
        updateOrbit3D(data);
        updateGroundTrack2D(data);
        updateResults(data);
        setStatus('Ready 就绪');
    } catch (e) {
        alert('Computation failed 计算失败: ' + e.message);
        setStatus('Failed: ' + e.message);
    } finally {
        btnCompute.disabled = false;
        btnCompute.textContent = 'Compute 计算轨道';
    }
}

form.addEventListener('submit', (e) => {
    e.preventDefault();
    function getFloat(id, fallback) {
        const v = parseFloat(document.getElementById(id).value);
        return isNaN(v) ? fallback : v;
    }
    function getInt(id, fallback) {
        const v = parseInt(document.getElementById(id).value, 10);
        return isNaN(v) ? fallback : v;
    }
    const params = {
        perigee: getFloat('perigee', 400),
        apogee: getFloat('apogee', 400),
        inclination: getFloat('inclination', 51.6),
        raan: getFloat('raan', 0),
        arg_perigee: getFloat('argPerigee', 0),
        num_orbits: getInt('numOrbits', 5),
    };
    if (hasTLE) {
        const st = getSimTime();
        if (st && !isNaN(st.getTime())) {
            const deltaDays = (st - epochDate) / 86400000;
            const M = ((M0_at_epoch + nRevPerDay * deltaDays * 360) % 360 + 360) % 360;
            params.mean_anomaly = M;
            currentEpoch = st;
        }
    } else {
        const epochStr = document.getElementById('epochInput').value.trim();
        if (epochStr) {
            const parsed = parseEpochInput(epochStr);
            if (parsed) {
                currentEpoch = parsed;
                simDateInput.value = currentEpoch.toISOString().split('T')[0];
                simTimeInput.value = currentEpoch.toISOString().split('T')[1].substring(0, 8);
            }
        }
    }
    computeOrbit(params);
});

function parseTLEList(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
    const sats = [];
    let i = 0;
    while (i < lines.length) {
        let name = '', l1 = '', l2 = '';
        if (lines[i].startsWith('1 ') && i + 1 < lines.length && lines[i + 1].startsWith('2 ')) {
            l1 = lines[i]; l2 = lines[i + 1]; i += 2;
        } else if (i + 2 < lines.length && lines[i + 1].startsWith('1 ') && lines[i + 2].startsWith('2 ')) {
            name = lines[i]; l1 = lines[i + 1]; l2 = lines[i + 2]; i += 3;
        } else {
            i += 1;
            continue;
        }
        try {
            const t = parseTLE([name, l1, l2].filter(Boolean).join('\n'));
            t.name = (name || ('SAT-' + String(sats.length + 1).padStart(3, '0'))).replace(/[<>&]/g, '');
            sats.push(t);
        } catch (e) { /* skip malformed TLE entries */ }
    }
    return sats;
}

function sampleSatellites(sats, maxN) {
    if (sats.length <= maxN) return sats;
    const out = [];
    for (let i = 0; i < maxN; i++) {
        out.push(sats[Math.floor(i * sats.length / maxN)]);
    }
    return out;
}

async function loadConstellation() {
    const key = document.getElementById('constellationSelect').value;
    const density = parseInt(document.getElementById('constellationDensity').value, 10) || 60;
    const btn = document.getElementById('btnLoadConstellation');
    btn.disabled = true;
    setStatus('Fetching TLE group: ' + key + ' ...');
    let rawSats = null;
    let sourceLabel = '';
    let totalCount = 0;
    try {
        const resp = await fetch('/api/fetch-tle?group=' + encodeURIComponent(key));
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        const all = parseTLEList(text);
        if (all.length === 0) throw new Error('No valid TLE satellites parsed');
        rawSats = sampleSatellites(all, density);
        totalCount = all.length;
        sourceLabel = '在线 CELESTRAK ' + formatUtc(new Date()).substring(0, 10);
    } catch (e) {
        // Fallback: local preset snapshot (offline / fetch failure)
        setStatus('在线获取失败，尝试本地预设 ...');
        try {
            const pres = await (await fetch('/static/data/constellation_presets.json')).json();
            const g = pres.groups && pres.groups[key];
            if (!g || !g.satellites || !g.satellites.length) throw new Error('preset not found');
            const all = presetsToRaw(g.satellites);
            rawSats = sampleSatellites(all, density);
            totalCount = g.satellites.length;
            const fetched = (g.fetched_at || pres.generated_at || '').substring(0, 10);
            sourceLabel = '本地预设 ' + (fetched || '--');
        } catch (e2) {
            alert('Constellation load failed (online & preset): ' + e.message);
            setStatus('Constellation failed: ' + e.message);
            btn.disabled = false;
            return;
        }
    } finally {
        btn.disabled = false;
    }
    constellationCache = { groupKey: key, density, rawSats, sourceLabel, totalCount };
    await computeConstellationFromCache();
}

function presetsToRaw(sats) {
    return sats.map(s => ({
        name: String(s.name || 'SAT'),
        perigee: s.perigee,
        apogee: s.apogee,
        inclination: s.inclination,
        raan: s.raan,
        argPerigee: s.argPerigee,
        meanAnomaly: s.meanAnomaly,
        meanMotion: s.meanMotion,
        epoch: new Date(s.epoch),
        e: s.e,
        a: s.a,
    }));
}

async function computeConstellationFromCache() {
    const cache = constellationCache;
    if (!cache) return;
    const key = cache.groupKey;
    const grp = constellationGroups[key] || constellationGroups['gps-ops'];
    const prevSelected = selectedSatIndex;
    const st = getSimTime();
    setStatus('Computing ' + cache.rawSats.length + ' orbits ...');
    const payload = cache.rawSats.map(s => {
        const deltaDays = (st - s.epoch) / 86400000;
        const M = ((s.meanAnomaly + s.meanMotion * deltaDays * 360) % 360 + 360) % 360;
        return {
            name: s.name,
            perigee: s.perigee,
            apogee: s.apogee,
            inclination: s.inclination,
            raan: s.raan,
            arg_perigee: s.argPerigee,
            mean_anomaly: M,
        };
    });
    const res = await fetch('/api/compute-constellation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ satellites: payload, num_orbits: 2, points_per_orbit: 90 }),
    });
    if (!res.ok) {
        let msg = res.statusText;
        try { const err = await res.json(); msg = err.error || msg; } catch (e) {}
        alert('Constellation compute failed: ' + msg);
        return;
    }
    const data = await res.json();
    setupConstellation(data, st, key, cache.totalCount, cache.sourceLabel);
    if (prevSelected >= 0 && prevSelected < data.satellites.length) {
        selectSatellite(prevSelected);
    }
    setStatus('Constellation ready: ' + data.satellites.length + ' satellites (' + grp.label + ') - ' + cache.sourceLabel);
}

async function rebuildConstellationFromCache() {
    if (!constellationCache) return;
    await computeConstellationFromCache();
}

function setupConstellation(data, epoch, groupKey, totalCount, sourceLabel) {
    clearConstellationVisuals();
    constellationMode = true;
    constellationGroupKey = groupKey;
    currentEpoch = epoch;
    hasOrbit = false;
    orbitCurve3D = null;
    orbitGroup.visible = false;
    // Remove any leftover single-satellite 2D/coverage visuals
    groundTrackLayer.clearLayers();
    if (leafletSatMarker2D) {
        leafletMap.removeLayer(leafletSatMarker2D);
        leafletSatMarker2D = null;
    }
    coverage3DGroup.visible = false;
    coverageConeGroup.visible = false;
    setD3Path('coverageFill', null);
    setD3Path('coverageLine', null);
    constellationSourceLabel = sourceLabel || '';
    selectedSatIndex = -1;

    const grp = constellationGroups[groupKey] || constellationGroups['gps-ops'];
    const sats = data.satellites;
    constellation = {
        sats: sats,
        duration: data.sim_duration || 7200,
        numOrbits: data.num_orbits || 2,
    };
    const markerGeo = new THREE.SphereGeometry(70, 12, 12);

    sats.forEach((s, i) => {
        s.periodSec = s.orbital_elements.period_min * 60;
        // 3D orbit ring
        const ringPts = [];
        for (let j = 0; j < s.orbit_ring.x.length; j++) {
            ringPts.push(eciToThree(s.orbit_ring.x[j], s.orbit_ring.y[j], s.orbit_ring.z[j]));
        }
        if (ringPts.length >= 2) {
            constellationGroup3D.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(ringPts),
                new THREE.LineBasicMaterial({ color: grp.color3d, transparent: true, opacity: 0.22 })
            ));
        }
        // 3D marker
        const mesh = new THREE.Mesh(markerGeo, new THREE.MeshBasicMaterial({ color: grp.color3d }));
        mesh.userData.satIndex = i;
        constellationGroup3D.add(mesh);
        constellationMarkers3D.push(mesh);
        // 2D marker
        const cm = L.circleMarker([0, 0], {
            radius: 3, color: grp.color, weight: 1,
            fillColor: grp.color, fillOpacity: 0.85,
        });
        cm.on('click', () => selectSatellite(i));
        cm.addTo(leafletMap);
        constellationMarkers2D.push(cm);
        // Ground trail polyline
        const trail = L.polyline([], { color: grp.color, weight: 1, opacity: 0.35 });
        trail.addTo(leafletMap);
        constellationTrails.push(trail);
    });

    numOrbitsAnim = data.num_orbits || 2;
    animStartTime = performance.now() / 1000;
    isPaused = false;
    btnPause.innerHTML = '\u25AE\u25AE';
    progSlider.value = 0;
    progTimeLabel.textContent = 'T+00:00:00 / ' + (epoch ? formatUtc(epoch) : '----') + ' UTC';

    const periods = sats.map(s => s.orbital_elements.period_min);
    const minP = Math.min(...periods), maxP = Math.max(...periods);
    resultsContent.innerHTML = [
        ['星座 Constellation', grp.label],
        ['组内卫星总数 Total in group', totalCount],
        ['显示数量 Displayed', sats.length],
        ['数据源 Source', constellationSourceLabel || '--'],
        ['周期范围 Period range', minP.toFixed(1) + ' - ' + maxP.toFixed(1) + ' min'],
        ['提示 Tip', '点击 2D 地图标记切换跟踪卫星'],
    ].map(([label, value]) =>
        `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`
    ).join('');
    populateSatSelect();
    selectSatellite(0);
}

function showSatelliteDetails(i) {
    const s = constellation.sats[i];
    const el = s.orbital_elements;
    const grp = constellationGroups[constellationGroupKey] || {};
    const rows = [
        ['卫星 Name', s.name],
        ['星座 Group', grp.label || constellationGroupKey],
        ['数据源 Source', constellationSourceLabel || '--'],
        ['半长轴 Semi-major axis', el.semi_major_axis.toLocaleString() + ' km'],
        ['偏心率 Eccentricity', el.eccentricity],
        ['周期 Period', el.period_min.toLocaleString() + ' min'],
        ['近地点 Perigee alt', el.perigee_alt.toLocaleString() + ' km'],
        ['远地点 Apogee alt', el.apogee_alt.toLocaleString() + ' km'],
    ];
    resultsContent.innerHTML = rows.map(([label, value]) =>
        `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`
    ).join('');
}

function selectSatellite(i) {
    if (!constellation || i < 0 || i >= constellation.sats.length) return;
    selectedSatIndex = i;
    constellationMarkers2D.forEach((m, k) => {
        m.setStyle({
            radius: k === i ? 6 : 3,
            weight: k === i ? 2 : 1,
            fillOpacity: k === i ? 1 : 0.7,
        });
    });
    constellationMarkers3D.forEach((m, k) => {
        m.scale.setScalar(k === i ? 2.2 : 1);
        m.material.opacity = k === i ? 1 : 0.8;
        m.material.transparent = true;
    });
    const sel = document.getElementById('constellationSatSelect');
    if (sel && sel.options.length > i) sel.value = String(i);
    document.getElementById('btnViewSingle').disabled = false;
    showSatelliteDetails(i);
}

function clearConstellationVisuals() {
    clearGroup(constellationGroup3D);
    constellationMarkers2D.forEach(m => leafletMap.removeLayer(m));
    constellationTrails.forEach(t => leafletMap.removeLayer(t));
    constellationMarkers2D = [];
    constellationTrails = [];
    constellationMarkers3D = [];
    constellation = null;
    constellationMode = false;
    selectedSatIndex = -1;
    clearSatSelect();
}

function clearConstellation() {
    if (!constellationMode && !constellation) return;
    setUiMode('single');
    setStatus('Constellation cleared - single-satellite mode');
}

function restoreSingleVisuals() {
    orbitGroup.visible = true;
    if (lastSingleData) {
        updateOrbit3D(lastSingleData);
        updateGroundTrack2D(lastSingleData);
        updateResults(lastSingleData);
    }
}

function setUiMode(mode) {
    uiMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.mode === mode)
    );
    document.getElementById('orbitForm').style.display = mode === 'single' ? '' : 'none';
    document.getElementById('presetsSection').style.display = mode === 'single' ? '' : 'none';
    document.getElementById('constellationSection').style.display = mode === 'constellation' ? '' : 'none';
    if (mode === 'constellation') {
        if (!constellation && constellationCache) {
            setStatus('Rebuilding constellation ...');
            rebuildConstellationFromCache();
        } else if (!constellation) {
            resultsContent.innerHTML =
                '<div class="row"><span class="label">提示 Tip</span><span class="value">请点击 Load 加载星座</span></div>';
            setStatus('Constellation mode - click Load to fetch a group');
        } else {
            populateSatSelect();
        }
    } else {
        if (constellationMode || constellation) {
            clearConstellationVisuals();
            restoreSingleVisuals();
        }
        clearSatSelect();
    }
}

function populateSatSelect() {
    const sel = document.getElementById('constellationSatSelect');
    if (!sel) return;
    sel.innerHTML = '';
    if (!constellation) {
        sel.disabled = true;
        document.getElementById('btnViewSingle').disabled = true;
        return;
    }
    constellation.sats.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = s.name + ' [' + i + ']';
        sel.appendChild(opt);
    });
    sel.disabled = false;
    sel.value = String(Math.max(0, selectedSatIndex));
    document.getElementById('btnViewSingle').disabled = false;
}

function clearSatSelect() {
    const sel = document.getElementById('constellationSatSelect');
    if (sel) {
        sel.innerHTML = '<option value="">-- 加载星座后选择 --</option>';
        sel.disabled = true;
    }
    document.getElementById('btnViewSingle').disabled = true;
}

function viewSelectedAsSingle() {
    if (!constellation || selectedSatIndex < 0) return;
    const raw = constellationCache && constellationCache.rawSats[selectedSatIndex];
    if (!raw) {
        alert('缺少该星的轨道参数缓存');
        return;
    }
    const st = getSimTime();
    document.getElementById('perigee').value = raw.perigee.toFixed(1);
    document.getElementById('apogee').value = raw.apogee.toFixed(1);
    document.getElementById('inclination').value = raw.inclination.toFixed(4);
    document.getElementById('raan').value = raw.raan.toFixed(4);
    document.getElementById('argPerigee').value = raw.argPerigee.toFixed(4);
    document.getElementById('numOrbits').value = 3;
    document.getElementById('epochInput').value = formatUtc(raw.epoch);
    hasTLE = true;
    M0_at_epoch = raw.meanAnomaly;
    nRevPerDay = raw.meanMotion;
    epochDate = raw.epoch;
    currentEpoch = st;
    singleSatName = raw.name;
    setUiMode('single');
    const deltaDays = (st - raw.epoch) / 86400000;
    const M = ((raw.meanAnomaly + raw.meanMotion * deltaDays * 360) % 360 + 360) % 360;
    computeOrbit({
        perigee: raw.perigee,
        apogee: raw.apogee,
        inclination: raw.inclination,
        raan: raw.raan,
        arg_perigee: raw.argPerigee,
        num_orbits: 3,
        mean_anomaly: M,
    });
}

document.querySelectorAll('.mode-btn').forEach(b => {
    b.addEventListener('click', () => setUiMode(b.dataset.mode));
});
document.getElementById('constellationSatSelect').addEventListener('change', (e) => {
    const v = parseInt(e.target.value, 10);
    if (!isNaN(v)) selectSatellite(v);
});
document.getElementById('btnViewSingle').addEventListener('click', viewSelectedAsSingle);

function getEciAtTime(s, elapsedSec) {
    const n = s.anim.x.length;
    const total = s.periodSec * (constellation ? constellation.numOrbits : 1);
    const frac = (((elapsedSec % total) + total) % total) / total;
    const idx = frac * (n - 1);
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, n - 1);
    const t = idx - i0;
    return [
        s.anim.x[i0] + (s.anim.x[i1] - s.anim.x[i0]) * t,
        s.anim.y[i0] + (s.anim.y[i1] - s.anim.y[i0]) * t,
        s.anim.z[i0] + (s.anim.z[i1] - s.anim.z[i0]) * t,
    ];
}

// ── Constellation coverage overlap heatmap (2D) ──
function updateCoverageHeatmap(simElapsed, thetaGP) {
    if (!constellationMode || !constellation || !coverageEnabled) {
        covHeatCtx.clearRect(0, 0, covHeatCanvas.width || 1, covHeatCanvas.height || 1);
        return;
    }
    const W = map2dEl.clientWidth, H = map2dEl.clientHeight;
    if (W <= 0 || H <= 0) return;
    const scale = 0.5;
    const cw = Math.max(2, Math.round(W * scale));
    const ch = Math.max(2, Math.round(H * scale));
    if (covAccCanvas.width !== cw) covAccCanvas.width = cw;
    if (covAccCanvas.height !== ch) covAccCanvas.height = ch;
    covAccCtx.clearRect(0, 0, cw, ch);
    covAccCtx.fillStyle = 'rgb(1,1,1)';
    covAccCtx.globalCompositeOperation = 'lighter';

    const sats = constellation.sats;
    for (let i = 0; i < sats.length; i++) {
        const s = sats[i];
        const [eciX, eciY, eciZ] = getEciAtTime(s, simElapsed);
        const alt = Math.sqrt(eciX * eciX + eciY * eciY + eciZ * eciZ) - R_EARTH;
        if (alt <= 0) continue;
        const [lat, lon] = eciToLatLon(eciX, eciY, eciZ, thetaGP);
        if (!isFinite(lat) || !isFinite(lon)) continue;
        const pts = computeCoverageCircle(lat, lon, coverageElevation, alt);
        if (pts.length === 0) continue;
        covAccCtx.beginPath();
        for (let j = 0; j < pts.length; j++) {
            const cp = leafletMap.latLngToContainerPoint([pts[j].lat, pts[j].lon]);
            const x = cp.x * scale, y = cp.y * scale;
            if (j === 0) covAccCtx.moveTo(x, y);
            else covAccCtx.lineTo(x, y);
        }
        covAccCtx.closePath();
        covAccCtx.fill();
    }
    covAccCtx.globalCompositeOperation = 'source-over';

    const imgData = covAccCtx.getImageData(0, 0, cw, ch);
    const px = imgData.data;
    for (let p = 0; p < px.length; p += 4) {
        const c = px[p];
        if (c === 0) {
            px[p + 3] = 0;
            continue;
        }
        let r, g, b, a;
        if (c === 1) { r = 0; g = 120; b = 255; a = 150; }
        else if (c === 2) { r = 0; g = 200; b = 220; a = 160; }
        else if (c === 3) { r = 30; g = 220; b = 100; a = 170; }
        else if (c === 4) { r = 255; g = 190; b = 0; a = 180; }
        else { r = 255; g = 60; b = 60; a = 195; }
        px[p] = r; px[p + 1] = g; px[p + 2] = b; px[p + 3] = a;
    }
    covAccCtx.putImageData(imgData, 0, 0);
    if (covHeatCanvas.width !== W) covHeatCanvas.width = W;
    if (covHeatCanvas.height !== H) covHeatCanvas.height = H;
    covHeatCtx.clearRect(0, 0, W, H);
    covHeatCtx.imageSmoothingEnabled = true;
    covHeatCtx.drawImage(covAccCanvas, 0, 0, cw, ch, 0, 0, W, H);
}

document.getElementById('btnLoadConstellation').addEventListener('click', loadConstellation);
document.getElementById('btnClearConstellation').addEventListener('click', clearConstellation);

// ── Render loop with animation ──
function animate(timestamp) {
    requestAnimationFrame(animate);

    const nowSec = timestamp / 1000;
    let fraction;
    if (isScrubbing || isPaused) {
        fraction = parseInt(progSlider.value) / 1000;
    } else {
        const totalAnimTime = animSpeedSec * numOrbitsAnim;
        fraction = (nowSec - animStartTime) / totalAnimTime;
        if (fraction >= 1) {
            fraction = 1;
            isPaused = true;
            btnPause.innerHTML = '\u25B6';
        }
        progSlider.value = Math.round(fraction * 1000);
    }

    if (constellationMode && constellation) {
        animateConstellation(fraction);
    } else if (hasOrbit && orbitCurve3D) {
        animateSingleSat(fraction);
    }

    controls.update();
    renderer.render(scene, camera);
}

function animateSingleSat(fraction) {
    const simElapsed = fraction * orbitPeriodSec * numOrbitsAnim;
    const tSincePerigee = tOffset + simElapsed;

    // Update time display
    const elapsedStr = formatElapsed(tSincePerigee);
    let utcStr = '----';
    if (currentEpoch && !isNaN(currentEpoch.getTime())) {
        const utcMs = currentEpoch.getTime() + (tSincePerigee - tOffset) * 1000;
        const utcDate = new Date(utcMs);
        utcStr = formatUtc(utcDate);
        progTimeLabel.textContent = elapsedStr + ' / ' + utcStr + ' UTC';
        const dateStr = utcDate.toISOString().split('T')[0];
        if (dateStr !== lastSunDate) {
            setSunData(utcDate);
            lastSunDate = dateStr;
        }
    } else {
        progTimeLabel.textContent = elapsedStr + ' / ' + utcStr;
    }

    // 3D satellite position (ECI inertial frame)
    const [eciX, eciY, eciZ] = getEciPosition(fraction);
    const satPos3 = eciToThree(eciX, eciY, eciZ);
    if (satMarkerGroup) {
        satMarkerGroup.position.copy(satPos3);
    }

    // Compute Earth rotation angle
    let thetaGP;
    if (currentEpoch) {
        const gstRad = (getGST(currentEpoch) % 360) * Math.PI / 180;
        thetaGP = gstRad + OMEGA_E * (tSincePerigee - tOffset);
    } else {
        thetaGP = OMEGA_E * tSincePerigee;
    }

    // Ground projection on Earth surface (in Earth's local ECEF frame)
    const gpMarker = earthGroup.getObjectByName('groundProj');
    if (gpMarker) {
        const cosT = Math.cos(thetaGP);
        const sinT = Math.sin(thetaGP);
        const x_ecef = eciX * cosT + eciY * sinT;
        const y_ecef = -eciX * sinT + eciY * cosT;
        const z_ecef = eciZ;
        const dist_ecef = Math.sqrt(x_ecef * x_ecef + y_ecef * y_ecef + z_ecef * z_ecef);
        if (dist_ecef > R_EARTH * 1.001) {
            const scale = R_EARTH / dist_ecef;
            gpMarker.position.set(x_ecef * scale, z_ecef * scale, -y_ecef * scale);
            gpMarker.visible = true;
        } else {
            gpMarker.visible = false;
        }
    }

    // Rotate Earth eastward (syncs 3D terminator, gpMarker, and 2D marker)
    earthGroup.rotation.y = thetaGP;

    // 2D satellite marker on Leaflet
    const [lat2d, lon2d] = eciToLatLon(eciX, eciY, eciZ, thetaGP);
    if (leafletSatMarker2D && isFinite(lat2d) && isFinite(lon2d)) {
        leafletSatMarker2D.setLatLng([lat2d, lon2d]);
    }
    // Coverage footprint (after earthGroup rotation is set)
    if (hasOrbit) {
        earthGroup.updateMatrixWorld();
        const [lat, lon] = eciToLatLon(eciX, eciY, eciZ, thetaGP);
        const dist = Math.sqrt(eciX * eciX + eciY * eciY + eciZ * eciZ);
        const alt = dist - R_EARTH;
        if (alt > 0) updateCoverage(lat, lon, alt, eciX, eciY, eciZ, thetaGP);
    }

    // Animate 2D terminator — sync with 3D Earth rotation
    updateCoverageHeatmap(simElapsed, thetaGP);
    const gstNow = ((earthGroup.rotation.y * 180 / Math.PI) % 360 + 360) % 360;
    updateTerminatorDynamic(gstNow);
}

function animateConstellation(fraction) {
    const simElapsed = fraction * constellation.duration;
    const elapsedStr = formatElapsed(simElapsed);
    let utcStr = '----';
    if (currentEpoch && !isNaN(currentEpoch.getTime())) {
        const utcDate = new Date(currentEpoch.getTime() + simElapsed * 1000);
        utcStr = formatUtc(utcDate);
        const dateStr = utcDate.toISOString().split('T')[0];
        if (dateStr !== lastSunDate) {
            setSunData(utcDate);
            lastSunDate = dateStr;
        }
    }
    progTimeLabel.textContent = elapsedStr + ' / ' + utcStr + ' UTC';

    const thetaGP = (currentEpoch && !isNaN(currentEpoch.getTime()))
        ? ((getGST(currentEpoch) % 360) * Math.PI / 180 + OMEGA_E * simElapsed)
        : OMEGA_E * simElapsed;
    earthGroup.rotation.y = thetaGP;
    lastSimElapsed = simElapsed;
    lastThetaGP = thetaGP;

    const showTrails = document.getElementById('toggleTrails').checked;
    const n = constellation.sats.length;
    const trailsForAll = n <= 60;

    for (let i = 0; i < n; i++) {
        const s = constellation.sats[i];
        const [eciX, eciY, eciZ] = getEciAtTime(s, simElapsed);
        constellationMarkers3D[i].position.copy(eciToThree(eciX, eciY, eciZ));
        const [lat, lon] = eciToLatLon(eciX, eciY, eciZ, thetaGP);
        if (isFinite(lat) && isFinite(lon)) {
            constellationMarkers2D[i].setLatLng([lat, lon]);
        }

        if (showTrails && (trailsForAll || i === selectedSatIndex)) {
            const pts = [];
            for (let k = 7; k >= 0; k--) {
                const ts = simElapsed - k * 75; // 10-minute trail in 75s steps
                const [px, py, pz] = getEciAtTime(s, ts);
                const th = thetaGP - OMEGA_E * (simElapsed - ts);
                const [tlat, tlon] = eciToLatLon(px, py, pz, th);
                if (isFinite(tlat) && isFinite(tlon)) pts.push([tlat, tlon]);
            }
            constellationTrails[i].setLatLngs(pts);
        } else if (!showTrails && constellationTrails[i].getLatLngs().length > 0) {
            constellationTrails[i].setLatLngs([]);
        }
    }

    // Coverage: 2D overlap heatmap for all satellites (no selection required)
    covHeatFrame++;
    if (covHeatFrame % 8 === 0) updateCoverageHeatmap(simElapsed, thetaGP);

    const gstNow = ((thetaGP * 180 / Math.PI) % 360 + 360) % 360;
    updateTerminatorDynamic(gstNow);
}

// ── Resize ──
window.addEventListener('resize', () => {
    const w = globeContainer.clientWidth;
    const h = globeContainer.clientHeight;
    if (w <= 0 || h <= 0) return;
    renderer.setSize(w, h);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
    leafletMap.invalidateSize();
});

// ── Start render loop ──
// Ensure canvas has correct size before first render
const doResize = () => {
    const w = globeContainer.clientWidth;
    const h = globeContainer.clientHeight;
    if (w > 0 && h > 0) {
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
};
doResize();
requestAnimationFrame(animate);

// ── Initial load ──
loadingEl.style.display = 'none';
setTimeout(() => {
    leafletMap.invalidateSize();
    computeOrbit({ perigee: 400, apogee: 400, inclination: 51.6, raan: 0, arg_perigee: 0, num_orbits: 5 });
}, 500);
</script>
